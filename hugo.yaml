# https://github.com/gurusabarish/hugo-profile

baseURL: "https://iurii.io/"
languageCode: "en"
title: "Iurii Chmykhun"
theme: hugo-profile

defaultContentLanguage: "en"

# enableEmoji=true

languages:
  en:
    languageName: "English"
    weight: 1
    contentDir: "content"
    menu:
      main:
        - identifier: blog
          name: Blog
          title: Blog posts
          url: /blogs
          weight: 1

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: false

Menus:
  main:
    - identifier: blog
      name: Blog
      title: Blog Posts
      url: /blogs
      weight: 1

params:
  title: "Iurii Chmykhun"
  description: Iurii Chmykhun's website & blog!
  customCSS: true
  # staticPath: ""  # The path to serve the static files from
  favicon: "/fav.png"
  favicon_sizes:
    - 16
    - 32
    - 180

  # Whether the fade animations on the home page will be enabled
  animate: true

  theme:
    # disableThemeToggle: false
    defaultTheme: "dark"

  font:
    fontSize: 1rem # default: 1rem
    fontWeight: 400 # default: 400
    lineHeight: 1.5 # default: 1.5
    textAlign: left # default: left

  # If you want to customize the menu, you can change it here
  navbar:
    align: ms-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    brandLogo: "/images/profile.jpg" # Logo for the brand | default is the favicon variable
    showBrandLogo: false # Show brand logo in nav bar | default is true
    brandName: "Iurii Chmykhun" # Brand name for the brand | default is the title variable
    disableSearch: false
    searchPlaceholder: "Search (Ctrl+K)"
    stickyNavBar:
      enable: true
      showOnScrollUp: true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false

  # Hero
  hero:
    enable: true
    intro: "Hi, I'm"
    title: "Iurii Chmykhun."
    subtitle: "Student, Developer, Learner."
    content: "Current Masters CS student at Dakota State University. Check out my professional experience, take a look at my GitHub profile, and read my blog (add my RSS feed)!"
    image: /images/profile.jpg
    bottomImage:
      enable: true
    # roundImage: true # Make hero image circular | default false
    button:
      enable: false
      name: "Resume"
      url: "#"
      download: true
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/blurryiurii
        # - icon: fab fa-x-twitter
        #   url: https://example.com
        - icon: fab fa-linkedin
          url: https://www.linkedin.com/in/iuriic/
        - icon: fab fa-instagram
          url: https://instagram.com/blurryiurii
        - icon: fas fa-rss
          url: /index.xml
      # customIcons:
      #   - icon: /fav.png
      #     url: "https://example.com"

  about:
    enable: true
    title: "About Me"
    # image: "/images/me.png"
    content: |-
      Currently in MS Computer Science program at <a href="https://dsu.edu" target="_blank">DSU</a>.
      I'm local to South Dakota and am enlisted in the <a href='https://114thfw.ang.af.mil' target='_blank'>SD Air National Guard</a> as a Maintenance Data Analyst since 2023.
      I'm active throughout Madison, leading the Computer Club, participating in Math Club as well as Programming Club.
      I've worked on many projects, available on my <a href="https://github.com/blurryiurii/" target="_blank">GitHub</a>.
    skills:
      enable: true
      title: "Through self-learning and coursework, I am experienced with the following:"
      items:
        - "Python (and many libraries: pandas, PyQt6, PyGame, SQLAlchemy, requests, etc.)"
        - "HTML/CSS/JavaScript"
        - "C & C++ (general purpose & competitive programming)"
        - "Object-Oriented Design"
        - "Microsoft SQL Server, Power BI Reports, Microsoft Fabric, Data Analysis & Reporting"
        - "Docker (I've built a <a href='https://github.com/blurryiurii/homelab' target='_blank'>homelab</a>!), Git, AWS, GCP, Microsoft Azure."

  experience:
    enable: true
    title: "Professional Experience"
    items:
      - job: "Maintenance Data Analyst"
        company: "SD Air National Guard"
        companyUrl: "https://www.114fw.ang.af.mil/"
        date: "July 2023 - Present"
        content: |-
          - Collect and report periodic database maintenance data to senior leadership
          - Update database information and scripts to ensure accuracy and usability
          - Automate repetitive processes, track data, present findings using Excel, Power BI, Teams

      - job: "Business Intelligence Developer Intern"
        company: "Agtegra Cooperative"
        companyUrl: "https://www.agtegra.com/"
        date: "May 2025 - July 2025"
        content: |-
          - Store and analyze business data and build Power BI reports to drive informed company decisions
          - Build automated workflows with Apache Airflow to monitor ERP integration success
          - Collaboratively develop end-user applications using Python with PyQt6

      - job: "Sandwich Artist & Cashier"
        company: "Capriottis Sandwich Shop"
        companyUrl: "https://capriottis.com/location/s-marion-road-1742411"
        date: "Oct 2022 - Aug 2023"
        content: |-
          - Serve hot/cold sandwiches, casher at counter, deliver caring customer service

  education:
    enable: true
    # title: "Custom Name"
    index: false
    items:
      - title: "B.S. / M.S. Computer Science"
        school:
          name: "Dakota State University - Madison, SD"
          url: "https://dsu.edu"
        date: "Expected Master's in Fall 2026"
        GPA: "3.8"
        content: |-
            - CTF Club: Lead and Present on cybersecurity puzzles
            - Math Club: Solve Project Euler math puzzles and assist in teaching problem-solving techniques and solutions.
            - Programming Club: Understand & implement computer algorithms quickly and accurately on <a href="https://www.kattis.com" target="_blank">Kattis</a> and <a href="https://leetcode.com">LeetCode</a>.
      - title: "High School Diploma"
        school:
          name: "O'Gorman High School"
          url: "https://oghs.ogknights.org/o/oghs"
        date: "2019-2023"
        GPA: "4.2 (weighted)"
        content: |-
          National Honors Society member, Honors graduate.

  # achievements:
  # ...

  projects:
    enable: true
    # title: "Custom Name"
    items:
      - title: Prime Grid Labeling Algorithm
        content: Generation of an n * m matrix with values 1...nm such that all orthogonal neighbors are coprime.
        image: /images/projects/prime-grid.png
        featured:
          name: Source
          link: https://github.com/GanschowJosh/PrimeGridLabeling
        badges:
          - "Algorithms, Stacks, Backtracking"
          - "Python, MyPy Compiling, Multithreading"
          - "GitHub"
        links:
          - icon: fab fa-github
            url: https://github.com/GanschowJosh/PrimeGridLabeling

      - title: iurii.io
        content: This website! An interactive portfolio of my personal and professional development.
        image: /images/projects/htmlcssjs.png
        featured:
          name: Source
          link: https://github.com/blurryiurii/iurii.io
        badges:
          - "HTML/CSS/JS"
          - "Gohugo Framework"
          - "Cloudflare Pages"
        links:
          - icon: fab fa-github
            url: "https://iurii.io"

      - title: Capture The Flag
        content: My collection of hands-on computer puzzles aimed to instruct & educate. Includes OSINT, Pwn, Crypto, Forensics.
        image: /images/projects/dsucc.svg
        featured:
          name: CTFd Platform
          link: https://ctf.defsec.club/challenges
        badges:
          - "Cybersecurity"
          - "Clubs"
          - "Challenges"
        links:
          - icon: fab fa-github
            url: https://github.com/gurusabarish/HugoProfileV2

      - title: Sorting Visualizer
        content: A visualizer of the popular sorting algorithm "Bubble Sort"
        image: /images/projects/sorting.png
        featured:
          name: View in action!
          link: https://sort.iurii.io
        badges:
          - "HTML/CSS/JS"
          - "UX/UI"
          - "Challenges"
        links:
          - icon: fab fa-github
            url: https://github.com/blurryiurii/sort-visual

  # Contact
  contact:
    enable: true
    title: "Get in touch!"
    content: Reach out with any questions or just to have a chat!
    btnName: Email Me!
    btnLink: mailto:hello@iurii.io

  footer:
    recentPosts:
      path: "blogs"
      count: 4
      title: Recent Posts
      enable: true
      disableFeaturedImage: false
    socialNetworks:
      github: https://github.com/blurryiurii
      linkedin: https://linkedin.com/in/iuriic
      instagram: https://instagram.com/blurryiurii
      rss: /index.xml

  # List pages like blogs and posts
  listPages:
    disableFeaturedImage: false

  # Single pages like blog and post
  singlePages:
    socialShare: true
    readTime:
      enable: true
      content: "min read"
    scrollprogress:
      enable: true
    tags:
      openInNewTab: true

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"
